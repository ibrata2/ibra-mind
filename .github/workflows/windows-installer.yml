name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run provider and security smoke checks
        run: npm run test:smoke
      - name: Build Windows installer
        run: npm run dist:win
      - name: Verify packaged app renders its dashboard
        run: npm run test:desktop-smoke
      - name: Save installer for review
        uses: actions/upload-artifact@v4
        with:
          name: IBRA-MIND-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = "release/IBRA MIND Setup $version.exe"
          gh release view $tag --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "IBRA MIND v$version" --notes "Windows x64 installer for IBRA MIND. See the repository README for current features and limitations." --latest --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
